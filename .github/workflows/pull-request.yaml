name: pull request
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-format-types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Format Check
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Type Check (mypy)
        run: make types

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python versions
        run: uv python install 3.11 3.12 3.13
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests with tox
        run: uv run tox
      - name: Run E2E tests (Python 3.13)
        # Dependabot runs cannot access Actions secrets.
        if: github.actor != 'dependabot[bot]'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_API_KEY_OWNER_HANDLE: ${{ secrets.DUNE_API_KEY_OWNER_HANDLE }}
        run: uv run --python 3.13 --dev python -m pytest tests/e2e -v
